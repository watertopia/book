<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterTopia</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f9f9;
            color: #333;
            line-height: 1.6;
        }

        /* Navigation */
        header {
            background-color: #ffffff;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0077b6;
            text-decoration: none;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #555;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #0077b6;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0, 119, 182, 0.7), rgba(0, 180, 216, 0.6)), url('https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1950&q=80') no-repeat center center/cover;
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 20px;
            max-width: 600px;
        }

        .btn {
            display: inline-block;
            background-color: #0077b6;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #03045e;
            transform: translateY(-2px);
        }

        /* Booking Section */
        .booking-section {
            max-width: 600px;
            margin: 60px auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .booking-section h2 {
            color: #0077b6;
            margin-bottom: 20px;
            text-align: center;
            font-size: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #0077b6;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 18px;
        }

        /* Footer */
        footer {
            background-color: #03045e;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">WaterTopia</a>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#book">Book Now</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to WaterTopia</h1>
        <p>Dive into paradise. Experience the ultimate water park adventure and luxury resort getaway today.</p>
        <a href="#book" class="btn">Explore Passes</a>
    </section>

    <section id="book" class="booking-section">
        <h2>Book Now</h2>
        <form onsubmit="alert('Thank you for booking with WaterTopia! See you soon.'); return false;">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label for="date">Select Date</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="tickets">Pass Type</label>
                <select id="tickets">
                    <option value="day">Single Day Pass</option>
                    <option value="weekend">Weekend Experience</option>
                    <option value="vip">VIP All-Access Pass</option>
                </select>
            </div>

            <button type="submit" class="btn submit-btn">Confirm Booking</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 WaterTopia. All rights reserved.</p>
    </footer>

</body>
</html>
